<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a04b"/>
      <stop offset="100%" stop-color="#e0bb6a"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a04b"/>
      <stop offset="100%" stop-color="#e0bb6a"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Box with rounded corners -->
  <rect x="0" y="8" width="64" height="64" rx="16" fill="url(#iconGrad)"/>
  <rect x="0" y="8" width="64" height="64" rx="16" fill="none" 
        stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Signal bars -->
  <rect x="46" y="22" width="3" height="5" rx="1" fill="url(#goldGrad)" opacity="0.5"/>
  <rect x="51" y="20" width="3" height="7" rx="1" fill="url(#goldGrad)" opacity="0.7"/>
  <rect x="56" y="18" width="3" height="9" rx="1" fill="url(#goldGrad)"/>
  
  <!-- AM Monogram inside -->
  <text x="32" y="52" font-family="Georgia, 'Playfair Display', serif" 
        font-size="30" font-weight="700" fill="url(#goldGrad)" 
        text-anchor="middle" letter-spacing="-1">AM</text>
  
  <!-- Underline accent -->
  <rect x="16" y="58" width="32" height="2" rx="1" fill="url(#goldGrad)" opacity="0.5"/>
  
  <!-- Brand Name - Awais -->
  <text x="80" y="42" font-family="Georgia, 'Playfair Display', serif" 
        font-size="26" font-weight="700" fill="#1e1b4b" letter-spacing="-0.5">
    Awais
  </text>
  
  <!-- Brand Name - Mobile-Zone (Gold) -->
  <text x="80" y="66" font-family="Georgia, 'Playfair Display', serif" 
        font-size="20" font-weight="600" fill="url(#textGold)" letter-spacing="0.5">
    Mobile-Zone
  </text>
</svg>