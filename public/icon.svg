<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a04b"/>
      <stop offset="100%" stop-color="#e0bb6a"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#brandGrad)"/>
  
  <!-- Signal bars (mobile business feel) -->
  <rect x="44" y="14" width="3" height="6" rx="1" fill="url(#goldGrad)" opacity="0.5"/>
  <rect x="49" y="12" width="3" height="8" rx="1" fill="url(#goldGrad)" opacity="0.7"/>
  <rect x="54" y="10" width="3" height="10" rx="1" fill="url(#goldGrad)"/>
  
  <!-- AM Monogram -->
  <text x="30" y="42" font-family="Georgia, 'Playfair Display', serif" 
        font-size="26" font-weight="700" fill="url(#goldGrad)" 
        text-anchor="middle" letter-spacing="-1">AM</text>
  
  <!-- Underline accent -->
  <rect x="14" y="48" width="32" height="2" rx="1" fill="url(#goldGrad)" opacity="0.6"/>
</svg>